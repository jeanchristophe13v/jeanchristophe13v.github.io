<div class="container border-bottom">
  <div class="card my-5 pb-5 border-0">
    <div class="row">
      <div class="{% if include.last_post.image %}col-md-4{% else %}col-md-12{% endif %}">
        <div>
          <a href="{{ include.last_post.url | prepend: site.baseurl }}" class="text-reset">
            <h3>{{ include.last_post.title }}</h3>
          </a>
          {% assign summary = include.last_post.description | default: include.last_post.excerpt %}
          {% if summary %}
            <p class="card-text">{{ summary | strip_html | truncate: 160 }}</p>
          {% endif %}
          <p class="card-text"><small class="text-muted">{{ include.last_post.date | date_to_long_string }}</small></p>
        </div>
      </div>
      {% if include.last_post.image %}
        <div class="col-md-8">
          <img src="{{include.last_post.image}}" class="w-100" alt="image of {{ include.last_post.title }}">
        </div>
      {% endif %}
    </div>
  </div>
</div>

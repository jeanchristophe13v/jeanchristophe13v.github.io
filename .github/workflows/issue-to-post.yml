name: Issue → Post

on:
  issues:
    # 去掉 opened，避免“开 issue + 加标签”双触发
    types: [labeled, edited, reopened, closed]

permissions:
  contents: write
  issues: read

# 以 issue 编号为并发分组，杜绝同一条 issue 的重复并发
concurrency:
  group: "issue-${{ github.event.issue.number }}"
  cancel-in-progress: true

jobs:
  write:
    # 只有带 post 标签才执行；labeled 事件里进一步限定标签名
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'post') ||
      contains(github.event.issue.labels.*.name, 'post')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate/Update post from Issue (label=post)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const issue = context.payload.issue; // 直接用内置的 context/core

            const closed = (issue.state === 'closed');

            const slug = issue.title
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/(^-|-$)/g, '');

            const d = new Date(issue.created_at).toISOString().slice(0,10); // YYYY-mm-dd
            const fname = `${d}-${slug}-${issue.number}.md`;

            const targetDir = path.join('_collections', 'articles');
            fs.mkdirSync(targetDir, { recursive: true });

            const tags = issue.labels
              .map(l => l.name)
              .filter(n => n.toLowerCase() !== 'post');

            const fm = [
              '---',
              'layout: post',
              `title: "${issue.title.replace(/"/g, '\\"')}"`,
              `date: ${issue.created_at}`,
              `updated: ${issue.updated_at}`,
              `issue: ${issue.number}`,
              `published: ${!closed}`,
              `tags: [${tags.map(t => `"${t}"`).join(', ')}]`,
              '---',
              ''
            ].join('\n');

            const file = path.join(targetDir, fname);
            fs.writeFileSync(file, fm + (issue.body || ''), 'utf8');
            core.notice(`Wrote ${file}`);

      - name: Commit back
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(posts): sync issue #${{ github.event.issue.number }}"
          branch: master
          file_pattern: _collections/articles/*.md

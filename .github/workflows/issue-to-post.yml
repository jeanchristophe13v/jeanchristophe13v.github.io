name: Issue → Post

on:
  issues:
    # 仅在需要时触发，避免 opened 与 labeled 双触发造成并发取消提示
    types: [labeled, edited, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

# 以 issue 编号为并发分组,如果同一 issue 有新操作,取消之前的运行
concurrency:
  group: "issue-${{ github.event.issue.number }}"
  cancel-in-progress: true

jobs:
  write:
    # 只有带 post 标签才执行；labeled 事件里进一步限定标签名
    if: |
      github.event.action != 'closed' && (
        (github.event.action == 'labeled' && github.event.label.name == 'post') ||
        contains(github.event.issue.labels.*.name, 'post')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate/Update post from Issue (label=post)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const issue = context.payload.issue;

            // 输出调试信息
            core.info(`Processing issue #${issue.number}: ${issue.title}`);
            core.info(`Issue state: ${issue.state}`);
            core.info(`Issue labels: ${issue.labels.map(l => l.name).join(', ')}`);

            const closed = (issue.state === 'closed');

            const slug = issue.title
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/(^-|-$)/g, '');

            const d = new Date(issue.created_at).toISOString().slice(0,10);
            const fname = `${d}-${slug}-${issue.number}.md`;

            const targetDir = path.join('_collections', '_articles');
            core.info(`Creating directory: ${targetDir}`);
            fs.mkdirSync(targetDir, { recursive: true });

            const tags = issue.labels
              .map(l => l.name)
              .filter(n => n.toLowerCase() !== 'post');

            const body = issue.body || '';

            // 解析 issue form 字段
            let summary = '';
            let cleanBody = '';
            let coverType = '';
            let coverImage = '';

            // 解析 issue form 字段（兼容 textarea）
            if (issue.body) {
              const summaryMatch = issue.body.match(/###\s*摘要\s*\n+([\s\S]*?)(?=\n###\s*[^\n]+\n|$)/i);
              if (summaryMatch) summary = summaryMatch[1].replace(/_No response_\s*/gi, '').trim();

              const bodyMatch = issue.body.match(/###\s*博文正文\s*\n+([\s\S]*)/i);
              if (bodyMatch) cleanBody = bodyMatch[1];

              const coverTypeMatch = issue.body.match(/###\s*封面图设置\s*\n+([\s\S]*?)(?=\n###\s*[^\n]+\n|$)/i);
              if (coverTypeMatch) coverType = coverTypeMatch[1].replace(/_No response_\s*/gi, '').trim();

              const coverImageMatch = issue.body.match(/###\s*封面图 URL\s*\n+([\s\S]*?)(?=\n###\s*[^\n]+\n|$)/i);
              if (coverImageMatch) coverImage = coverImageMatch[1].replace(/_No response_\s*/gi, '').trim();
            }

            if (!cleanBody) cleanBody = issue.body || '';

            cleanBody = cleanBody
              .replace(/^###?\s*(摘要|博文正文|内容|Content|Post)\s*[:：]?\s*$/gim, '')
              .replace(/^_No response_\s*$/gim, '')
              .trim();

            // 定义优雅的配色方案（渐变）
            const colorGradients = {
              '#705050': 'linear-gradient(135deg, #705050 0%, #806060 100%)',
              '#675070': 'linear-gradient(135deg, #675070 0%, #776080 100%)',
              '#505470': 'linear-gradient(135deg, #505470 0%, #606480 100%)',
              '#506e70': 'linear-gradient(135deg, #506e70 0%, #607e80 100%)',
              '#507061': 'linear-gradient(135deg, #507061 0%, #608071 100%)',
              '#705b50': 'linear-gradient(135deg, #705b50 0%, #806b60 100%)'
            };

            const colorKeys = Object.keys(colorGradients);

            // 随机选择一个颜色
            function getRandomGradient() {
              const randomKey = colorKeys[Math.floor(Math.random() * colorKeys.length)];
              return {
                key: randomKey,
                gradient: colorGradients[randomKey]
              };
            }

            // 处理封面图逻辑
            let finalCoverImage = '';
            let backgroundColor = '';

            if (coverType === '使用自定义封面图' && coverImage) {
              // 用户选择使用自定义封面图
              finalCoverImage = coverImage.trim();
            } else if (coverType === '使用纯色背景（随机选择优雅配色）') {
              // 用户选择使用纯色背景
              const selectedColor = getRandomGradient();
              backgroundColor = selectedColor.gradient;
              finalCoverImage = ''; // 不使用封面图
            } else {
              // 兼容旧逻辑：如果没有选择或选择其他选项，仍使用正文第一张图片
              const imageRegex = /!\[.*?\]\((.*?)\)|<img[^>]+src=["']([^"']+)["']/;
              const imageMatch = cleanBody.match(imageRegex);
              finalCoverImage = imageMatch ? (imageMatch[1] || imageMatch[2]) : '';
            }

            // 生成描述（取正文前150个字符，去除 Markdown/占位词/图片）
            let description = '';
            const descriptionSource = summary || cleanBody;
            if (descriptionSource) {
              const sanitizedDescription = descriptionSource
                .replace(/!\[.*?\]\(.*?\)/g, '') // 移除图片
                .replace(/<img[^>]*>/g, '') // 秮除 HTML 图片
                .replace(/#{1,6}\s/g, '') // 移除标题标记
                .replace(/[*_~`]/g, '') // 移除格式化标记
                .replace(/\b(摘要|博文正文|内容|Content|Post)\b[:：]?/gi, '') // 移除中文/英文占位词
                .replace(/\n+/g, ' ') // 将多个换行替换为空格
                .trim();
              description = sanitizedDescription.slice(0, 150);
              if (sanitizedDescription.length > 150) description += '...';
            }

            const fm = [
              '---',
              'layout: post',
              `title: "${issue.title.replace(/"/g, '\\"')}"`,
              `description: "${description.replace(/"/g, '\\"').replace(/\n/g, ' ')}"`,
              finalCoverImage ? `image: "${finalCoverImage}"` : '',
              backgroundColor ? `background_color: "${backgroundColor}"` : '',
              `date: ${issue.created_at}`,
              `updated: ${issue.updated_at}`,
              `issue: ${issue.number}`,
              `published: ${!closed}`,
              `tags: [${tags.map(t => `"${t}"`).join(', ')}]`,
              '---'
            ].filter(Boolean).join('\n');

            const file = path.join(targetDir, fname);
            // 删除同一 issue 产生的旧文件（例如改标题导致文件名变化）
            if (fs.existsSync(targetDir)) {
              const files = fs.readdirSync(targetDir);
              const pattern = new RegExp(`-${issue.number}\\.md$`);
              files.forEach(f => {
                const fp = path.join(targetDir, f);
                if (pattern.test(f) && fp !== file && fs.existsSync(fp)) {
                  fs.unlinkSync(fp);
                  core.info(`Removed previous file for same issue: ${fp}`);
                }
              });
            }
            core.info(`Writing file: ${file}`);
            // 确保 front matter 和 body 之间有空行
            const content = fm + '\n\n' + cleanBody;
            fs.writeFileSync(file, content, 'utf8');
            core.notice(`✅ Successfully wrote ${file}`);

      - name: Commit back
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No post changes to commit."
            exit 0
          fi
          git commit -m "chore(posts): sync issue #${{ github.event.issue.number }}"
          git pull --rebase origin master
          git push origin HEAD:master

  delete:
    # 当 issue 被删除时执行（删除 issue 不会带标签，所以单独处理）
    if: github.event.action == 'closed' || github.event.action == 'deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete post file for deleted issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const issue = context.payload.issue;

            core.info(`Deleting post for issue #${issue.number}: ${issue.title}`);

            const targetDir = path.join('_collections', '_articles');
            
            // 查找所有匹配该 issue 编号的文件
            if (fs.existsSync(targetDir)) {
              const files = fs.readdirSync(targetDir);
              const pattern = new RegExp(`-${issue.number}\\.md$`);
              
              files.forEach(file => {
                if (pattern.test(file)) {
                  const filePath = path.join(targetDir, file);
                  fs.unlinkSync(filePath);
                  core.notice(`🗑️ Deleted ${filePath}`);
                }
              });
            }

      - name: Commit deletion
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No matching post to delete."
            exit 0
          fi
          git commit -m "chore(posts): delete post for issue #${{ github.event.issue.number }}"
          git pull --rebase origin master
          git push origin HEAD:master

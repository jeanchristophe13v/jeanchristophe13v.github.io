name: Issue → Post

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]

permissions:
  contents: write
  issues: read

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate/Update post from Issue (label=post)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const core = require('@actions/core');
            const issue = context.payload.issue;

            const hasPost = issue.labels.some(l => l.name.toLowerCase() === 'post');
            if (!hasPost) { core.info('No `post` label; skip'); return; }

            // 如果 Issue 被关闭，则把状态写到 front matter（也可以选择删除文件）
            const closed = (issue.state === 'closed');

            const slug = issue.title
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/(^-|-$)/g, '');

            const d = new Date(issue.created_at).toISOString().slice(0,10); // YYYY-mm-dd
            const fname = `${d}-${slug}-${issue.number}.md`;
            const file = path.join('_collections', 'articles', fname);


            const tags = issue.labels
              .map(l => l.name)
              .filter(n => n.toLowerCase() !== 'post');

            const fm = [
              '---',
              'layout: post',
              `title: "${issue.title.replace(/"/g, '\\"')}"`,
              `date: ${issue.created_at}`,
              `updated: ${issue.updated_at}`,
              `issue: ${issue.number}`,
              `published: ${!closed}`,
              `tags: [${tags.map(t => `"${t}"`).join(', ')}]`,
              '---',
              ''
            ].join('\n');

            fs.mkdirSync('_posts', { recursive: true });
            fs.writeFileSync(file, fm + (issue.body || ''), 'utf8');
            core.setOutput('file', file);

      - name: Commit back
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(posts): sync issue #${{ github.event.issue.number }}"
          branch: main

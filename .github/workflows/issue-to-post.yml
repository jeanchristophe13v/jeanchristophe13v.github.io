name: Issue → Post

on:
  issues:
    # 仅在需要时触发，避免 opened 与 labeled 双触发造成并发取消提示
    types: [labeled, edited, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

# 以 issue 编号为并发分组,如果同一 issue 有新操作,取消之前的运行
concurrency:
  group: "issue-${{ github.event.issue.number }}"
  cancel-in-progress: true

jobs:
  write:
    # 只有带 post 标签才执行；labeled 事件里进一步限定标签名
    if: |
      github.event.action != 'closed' && (
        (github.event.action == 'labeled' && github.event.label.name == 'post') ||
        contains(github.event.issue.labels.*.name, 'post')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate/Update post from Issue (label=post)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const issue = context.payload.issue;

            // 输出调试信息
            core.info(`Processing issue #${issue.number}: ${issue.title}`);
            core.info(`Issue state: ${issue.state}`);
            core.info(`Issue labels: ${issue.labels.map(l => l.name).join(', ')}`);

            const closed = (issue.state === 'closed');

            const slug = issue.title
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/(^-|-$)/g, '');

            const d = new Date(issue.created_at).toISOString().slice(0,10);
            const fname = `${d}-${slug}-${issue.number}.md`;

            const targetDir = path.join('_collections', '_articles');
            core.info(`Creating directory: ${targetDir}`);
            fs.mkdirSync(targetDir, { recursive: true });

            const tags = issue.labels
              .map(l => l.name)
              .filter(n => n.toLowerCase() !== 'post');

            const extractField = (label) => {
              if (!issue.body) return '';
              const pattern = new RegExp(`###\\s*${label}\\s*(?:\\r?\\n)+([\\s\\S]*?)(?=(?:\\r?\\n)###\\s*[^\\n]+\\n|$)`, 'i');
              const match = issue.body.match(pattern);
              if (!match) return '';
              return match[1].replace(/_No response_\s*/gi, '').trim();
            };

            const summary = extractField('摘要');
            let cleanBody = extractField('博文正文');
            let coverImage = extractField('封面图');
            if (coverImage) {
              const firstToken = coverImage.split(/\s+/).find(Boolean);
              coverImage = firstToken || '';
            }

            if (!cleanBody) cleanBody = issue.body || '';

            cleanBody = cleanBody
              .replace(/^###?\s*(摘要|博文正文|内容|Content|Post|封面图)\s*[:：]?\s*$/gim, '')
              .replace(/^_No response_\s*$/gim, '')
              .trim();

            // 生成描述（取正文前150个字符，去除 Markdown/占位词/图片）
            let description = '';
            const descriptionSource = summary || cleanBody;
            if (descriptionSource) {
              const sanitizedDescription = descriptionSource
                .replace(/!\[.*?\]\(.*?\)/g, '') // 移除图片
                .replace(/<img[^>]*>/g, '') // 秮除 HTML 图片
                .replace(/#{1,6}\s/g, '') // 移除标题标记
                .replace(/[*_~`]/g, '') // 移除格式化标记
                .replace(/\b(摘要|博文正文|内容|Content|Post|封面图)\b[:：]?/gi, '') // 移除中文/英文占位词
                .replace(/\n+/g, ' ') // 将多个换行替换为空格
                .trim();
              description = sanitizedDescription.slice(0, 150);
              if (sanitizedDescription.length > 150) description += '...';
            }

            const fm = [
              '---',
              'layout: post',
              `title: "${issue.title.replace(/"/g, '\\"')}"`,
              `description: "${description.replace(/"/g, '\\"').replace(/\n/g, ' ')}"`,
              coverImage ? `image: "${coverImage.replace(/"/g, '\\"')}"` : '',
              `date: ${issue.created_at}`,
              `updated: ${issue.updated_at}`,
              `issue: ${issue.number}`,
              `published: ${!closed}`,
              `tags: [${tags.map(t => `"${t}"`).join(', ')}]`,
              '---'
            ].filter(Boolean).join('\n');

            const file = path.join(targetDir, fname);
            // 删除同一 issue 产生的旧文件（例如改标题导致文件名变化）
            if (fs.existsSync(targetDir)) {
              const files = fs.readdirSync(targetDir);
              const pattern = new RegExp(`-${issue.number}\\.md$`);
              files.forEach(f => {
                const fp = path.join(targetDir, f);
                if (pattern.test(f) && fp !== file && fs.existsSync(fp)) {
                  fs.unlinkSync(fp);
                  core.info(`Removed previous file for same issue: ${fp}`);
                }
              });
            }
            core.info(`Writing file: ${file}`);
            // 确保 front matter 和 body 之间有空行
            const content = fm + '\n\n' + cleanBody;
            fs.writeFileSync(file, content, 'utf8');
            core.notice(`✅ Successfully wrote ${file}`);

      - name: Commit back
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No post changes to commit."
            exit 0
          fi
          git commit -m "chore(posts): sync issue #${{ github.event.issue.number }}"
          git pull --rebase origin master
          git push origin HEAD:master

  delete:
    # 当 issue 被删除时执行（删除 issue 不会带标签，所以单独处理）
    if: github.event.action == 'closed' || github.event.action == 'deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete post file for deleted issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const issue = context.payload.issue;

            core.info(`Deleting post for issue #${issue.number}: ${issue.title}`);

            const targetDir = path.join('_collections', '_articles');
            
            // 查找所有匹配该 issue 编号的文件
            if (fs.existsSync(targetDir)) {
              const files = fs.readdirSync(targetDir);
              const pattern = new RegExp(`-${issue.number}\\.md$`);
              
              files.forEach(file => {
                if (pattern.test(file)) {
                  const filePath = path.join(targetDir, file);
                  fs.unlinkSync(filePath);
                  core.notice(`🗑️ Deleted ${filePath}`);
                }
              });
            }

      - name: Commit deletion
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No matching post to delete."
            exit 0
          fi
          git commit -m "chore(posts): delete post for issue #${{ github.event.issue.number }}"
          git pull --rebase origin master
          git push origin HEAD:master

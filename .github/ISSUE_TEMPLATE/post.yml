name: Blog
description: 发布文章
labels: ["post"]
body:
  - type: markdown
    attributes:
      value: |
        ## 📝 撰写博文
        
        请在下方直接编写您的博文内容。支持 Markdown 格式和图片。
        
        **提示**：
        - Issue 标题会成为博文标题
        - 第一张图片会作为封面图
        - 摘要可填写在下一个输入框，若留空会自动取正文前 150 字符
  
  - type: textarea
    id: summary
    attributes:
      label: 摘要
      description: 用 1-2 句话概括文章，会直接展示在首页卡片上（可留空）
      placeholder: |
        用一句话告诉读者这篇文章的重点...
    validations:
      required: false

  - type: input
    id: cover
    attributes:
      label: 封面图
      description: 填写封面图 URL（可选）。留空则使用默认底色，不再自动抓取正文图片。
      placeholder: https://example.com/cover.jpg
    validations:
      required: false

  - type: textarea
    id: content
    attributes:
      label: 博文正文
      description: 在此处编写您的博文内容
      placeholder: |
        # 一级标题
        
        这是一段正常的文字...
        
        ## 二级标题
        
        - 列表项 1
        - 列表项 2
    validations:
      required: true
